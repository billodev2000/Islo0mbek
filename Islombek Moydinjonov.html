<title>Islombek Moydinjonov</title>
<style>
:root{
  --bg1:#c9d0d8; --bg2:#8f99a5; --ink:#1c2128; --muted:#3d4650;
  --line:#2b333c; --btn:#1f2a30; --btn-ink:#fff; --hero:#aeb6bf; --mark:#5d6772; --cta:#1f3a36;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3a424c;--bg2:#1d2228;--ink:#f1f3f5;--muted:#b9c0c8;--line:#d5dae0;--btn:#e8ecef;--btn-ink:#1c2128;--hero:#4a525c;--mark:#9aa4af;--cta:#e8ecef}
}
:root[data-theme="dark"]{--bg1:#3a424c;--bg2:#1d2228;--ink:#f1f3f5;--muted:#b9c0c8;--line:#d5dae0;--btn:#e8ecef;--btn-ink:#1c2128;--hero:#4a525c;--mark:#9aa4af;--cta:#e8ecef}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:"Manrope","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.page{width:100%;max-width:430px;padding-bottom:40px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);height:150px;background:var(--hero)}
.hero div{display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.25)}
.hero div:last-child{border:0}
.hero svg{width:80%;height:auto}
.hero text{fill:var(--mark);font-family:ui-monospace,Consolas,monospace;font-weight:700}
.avatar{width:92px;height:92px;border-radius:50%;margin:-46px auto 0;border:4px solid var(--bg1);
  background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;letter-spacing:1px;position:relative}
h1{font-size:22px;text-align:center;margin:14px 0 4px;font-weight:800}
.sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:14px}
.social{display:flex;justify-content:center;gap:14px;margin-bottom:24px}
.social a{width:38px;height:38px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center}
.social svg{width:20px;height:20px;fill:currentColor}
.links{display:grid;gap:12px;padding:0 24px}
.links a{display:flex;align-items:center;justify-content:center;position:relative;min-height:44px;padding:0 40px;
  border:1px solid var(--line);border-radius:22px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.links a:hover{background:rgba(255,255,255,.2)}
.links svg{position:absolute;width:16px;height:16px}
.links .l{left:16px;fill:currentColor}
.links .r{right:14px;fill:none;stroke:currentColor;stroke-width:2}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sign{padding:36px 24px 0}
.sign h2{font-size:17px;margin:0 0 12px;text-align:center}
.cta{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:8px;background:var(--cta);
  color:#fff;text-decoration:none;font-weight:700;font-size:14px}
:root:is([data-theme="dark"]) .cta{color:#1c2128}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta{color:#1c2128}}
</style>
</head>
